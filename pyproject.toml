[project]
name = "chessground"
version = "0.1.0"
description = "Chess repertoire analysis, API, worker, and desktop application"
requires-python = ">=3.13,<3.14"
dependencies = [
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "python-chess==1.999",
  "python-multipart==0.0.32",
  "redis==8.1.0",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
desktop = [
  "pyside6==6.11.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
