name: PostgreSQL and Redis CI

on:
  push:
  pull_request:

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chessground
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d chessground"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/chessground
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >-
          python -m pip install
          asyncpg==0.31.0 fastapi==0.141.1 python-chess==1.999
          python-multipart==0.0.32 "psycopg[binary]==3.2.10"
          redis==8.1.0 uvicorn==0.52.4 pytest==9.1.1
      - run: python -m backend.bootstrap_postgres_schema
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:ui-regression
      - run: npm run check:contracts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
