name: Parity Backlog Evidence Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  parity-backlog-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Verify parity backlog evidence
        run: uv run --no-sync python scripts/verify_parity_backlog.py
