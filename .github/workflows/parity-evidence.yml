name: Parity Backlog Evidence Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  parity-backlog-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Verify parity backlog evidence
        run: python scripts/verify_parity_backlog.py
