services:
  - type: web
    name: chessground-web
    runtime: node
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: API_BASE_URL
        value: https://chessground-api.onrender.com

  - type: web
    name: chessground-api
    runtime: python
    buildCommand: uv sync --locked --no-dev
    preDeployCommand: uv run --no-sync python -m backend.bootstrap_postgres_schema
    startCommand: uv run --no-sync uvicorn backend.api_service:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: UV_VERSION
        value: 0.10.2
      - key: POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
      - key: STOCKFISH_ENGINE_ID
        sync: false
      - key: API_CORS_ORIGINS
        value: https://chessground.onrender.com

  - type: worker
    name: chessground-orchestration-worker
    runtime: python
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync python -m backend.worker_service --capability orchestration
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: UV_VERSION
        value: 0.10.2
      - key: POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WORKER_CAPABILITY
        value: orchestration
      - key: STOCKFISH_ENGINE_ID
        sync: false

  - type: worker
    name: chessground-ingest-worker
    runtime: python
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync python -m backend.worker_service --capability ingest
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: UV_VERSION
        value: 0.10.2
      - key: POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WORKER_CAPABILITY
        value: ingest

  - type: worker
    name: chessground-engine-worker
    runtime: python
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync python -m backend.worker_service --capability engine
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: UV_VERSION
        value: 0.10.2
      - key: POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WORKER_CAPABILITY
        value: engine
      - key: STOCKFISH_PATH
        sync: false
      - key: STOCKFISH_DEPTH
        value: "14"
      - key: STOCKFISH_ENGINE_ID
        sync: false
